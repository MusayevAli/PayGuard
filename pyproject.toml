[project]
name = "payguard"
version = "0.1.0"
description = "Autonomous accounts-payable desk with payment authority enforced in hardware (Cal Hacks 13.0)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "structlog>=24.1",
    "schwifty>=2024.9",
    "python-stdnum>=1.20",
    "reportlab>=4.2",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    "numpy>=2.0",
    "certifi>=2024.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "fonttools>=4.53",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "sim", "api"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sim/world", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W", "T20"]
ignore = ["RUF012", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core", "sim/models.py"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
filterwarnings = [
    "error::DeprecationWarning:payguard.*",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:Warning",
]
